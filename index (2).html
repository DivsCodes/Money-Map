<script>
(async()=>{
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const now=new Date();
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const dateISO=(d)=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};
const currentMonth=()=>`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
const fyStartYear=(d=now)=>d.getMonth()>=3?d.getFullYear():d.getFullYear()-1;
const currentFY=()=>{const y=fyStartYear();return `${y}-${String(y+1).slice(-2)}`;};
const monthName=(ym)=>{const [y,m]=ym.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'})};
const money=n=>{if(data&&data.settings&&data.settings.hideBalances)return '₹ ••••';const raw=Number(n);const v=Number.isFinite(raw)?raw:0;return (v<0?'-':'')+'₹'+new Intl.NumberFormat('en-IN',{minimumFractionDigits:0,maximumFractionDigits:2}).format(Math.abs(v));};
const fmtDate=d=>{if(!d||!/^\d{4}-\d{2}-\d{2}$/.test(String(d)))return '—';const x=new Date(d+'T12:00:00');if(Number.isNaN(x.getTime()))return '—';return x.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});};

const categoryMeta={Food:{icon:'🍜',color:'#ed9d55'},Shopping:{icon:'🛍️',color:'#8b72e8'},Transport:{icon:'🚕',color:'#4779f5'},Bills:{icon:'⚡',color:'#dca02b'},Entertainment:{icon:'🎬',color:'#df6f9e'},Health:{icon:'🩺',color:'#2bb8a5'},Education:{icon:'📚',color:'#7292ef'},Travel:{icon:'✈️',color:'#37a5c6'},Home:{icon:'🏠',color:'#9b8d7b'},Salary:{icon:'💼',color:'#159b72'},Freelance:{icon:'💻',color:'#4b9cce'},Investment:{icon:'📈',color:'#159b72'},Other:{icon:'✦',color:'#8994a4'},Transfer:{icon:'⇄',color:'#8994a4'}};
let categories=Object.keys(categoryMeta);
function refreshCategories(){
 const custom=Array.isArray(data?.settings?.customCategories)?data.settings.customCategories:[];
 const meta=data?.settings?.categoryMeta||{};
 categories=[...Object.keys(categoryMeta),...custom.map(x=>String(x||'').trim()),...Object.keys(meta)].filter(x=>x&&x!=='Transfer').filter((x,i,a)=>a.indexOf(x)===i);
 categories.push('Transfer');
}
function categoryIcon(cat){const raw=String(data?.settings?.categoryMeta?.[cat]?.icon||categoryMeta[cat]?.icon||'✦');return raw.replace(/[&<>"']/g,'').slice(0,6)||'✦';}
function categoryColor(cat){return safeColor(data?.settings?.categoryMeta?.[cat]?.color||categoryMeta[cat]?.color||'#8994a4','#8994a4');}
function isSystemCategory(cat){return Object.prototype.hasOwnProperty.call(categoryMeta,cat);}

const emptyData=()=>({
 transactions:[],accounts:[],budgets:[],goals:[],bills:[],assets:[],liabilities:[],loans:[],taxes:[],incomeSources:[],
 netWorthSnapshots:[],reconciliations:[],recurringRules:[],deletedTransactions:[],
 settings:{theme:'light',month:currentMonth(),hideBalances:false,compactMode:false,monthlyIncomeTarget:0,financialYear:currentFY(),essentialCategories:['Food','Bills','Home','Health','Transport','Education'],runwayTargetMonths:6,demoMode:false,customCategories:[],categoryMeta:{},tags:[]}
});

const MM_STORAGE_KEY='moneymapindia.v1';
const collectionKeys=['transactions','accounts','budgets','goals','bills','assets','liabilities','loans','taxes','incomeSources','netWorthSnapshots','reconciliations','recurringRules','deletedTransactions'];
function normalizeDataset(input,strict=false){
 if(!input||typeof input!=='object'||Array.isArray(input))throw Error('Backup must contain a Money Map object.');
 const src=JSON.parse(JSON.stringify(input));
 if(strict&&!Array.isArray(src.transactions))throw Error('This file is not a valid Money Map backup: transactions are missing.');
 const base=emptyData();
 const out={...base,...src};
 out.settings={...base.settings,...(src.settings&&typeof src.settings==='object'&&!Array.isArray(src.settings)?src.settings:{})};
 if(!['light','dark'].includes(out.settings.theme))out.settings.theme='light';
 if(!/^\d{4}-\d{2}$/.test(String(out.settings.month||''))||Number(out.settings.month.slice(5))<1||Number(out.settings.month.slice(5))>12)out.settings.month=currentMonth();
 out.settings.hideBalances=!!out.settings.hideBalances;
 out.settings.customCategories=Array.isArray(out.settings.customCategories)?out.settings.customCategories.filter(x=>typeof x==='string'&&x.trim()).map(x=>x.trim()).filter((x,i,a)=>!Object.keys(categoryMeta).some(b=>b.toLowerCase()===x.toLowerCase())&&a.findIndex(y=>y.toLowerCase()===x.toLowerCase())===i):[];
 out.settings.categoryMeta=out.settings.categoryMeta&&typeof out.settings.categoryMeta==='object'&&!Array.isArray(out.settings.categoryMeta)?out.settings.categoryMeta:{};
 for(const key of collectionKeys)if(!Array.isArray(out[key]))out[key]=[];
 const seen=new Set();
 out.transactions=out.transactions.map((raw)=>{
  if(!raw||typeof raw!=='object'||Array.isArray(raw)) {if(strict)throw Error('A transaction in the backup is invalid.');return null;}
  const t={...raw};
  if(!['expense','income','transfer'].includes(t.type)){if(strict)throw Error('A transaction has an unsupported type.');t.type='expense';}
  const amount=Number(t.amount);if(!Number.isFinite(amount)||amount<0||(strict&&amount<=0)){if(strict)throw Error('A transaction has an invalid amount; amounts must be greater than zero.');t.amount=0;}else t.amount=roundCents(amount);
  if(!validISODateLocal(t.date)){if(strict)throw Error('A transaction has an invalid date.');}
  t.description=String(t.description||'Transaction').trim()||'Transaction';t.category=String(t.category||'Other');
  t.accountId=typeof t.accountId==='string'?t.accountId:'';t.toAccountId=typeof t.toAccountId==='string'?t.toAccountId:'';t.balanceFrozenAccounts=Array.isArray(t.balanceFrozenAccounts)?[...new Set(t.balanceFrozenAccounts.filter(x=>typeof x==='string'))].slice(0,50):[];if(!t.balanceFrozenAccounts.length)delete t.balanceFrozenAccounts;
  t.method=String(t.method||'');t.tags=Array.isArray(t.tags)?[...new Set(t.tags.map(v=>String(v).trim().replace(/^#+/,'').toLowerCase()).filter(v=>/^[a-z0-9][a-z0-9_-]{0,39}$/i.test(v)))].slice(0,20):[];
  if(t.type==='income'&&!t.taxTreatment)t.taxTreatment='taxable';
  if(t.type!=='income'){delete t.taxTreatment;delete t.reported;}
  if(t.type!=='expense')delete t.splits;
  if(Array.isArray(t.splits)&&t.splits.length){const splits=t.splits.map(x=>({category:String(x?.category||'Other').trim()||'Other',amount:roundCents(Number(x?.amount))}));const validSplits=splits.every(x=>Number.isFinite(x.amount)&&x.amount>0&&x.category!=='Transfer');const sum=roundCents(splits.reduce((a,x)=>a+x.amount,0));if(validSplits&&sum===roundCents(t.amount))t.splits=splits;else{if(strict)throw Error('An expense split is invalid or does not add up to its transaction amount.');delete t.splits;}}else if(strict&&Array.isArray(t.splits)&&t.splits.length===0){delete t.splits;}
  if(!t.id||seen.has(String(t.id)))t.id=uid();t.id=String(t.id);seen.add(t.id);return t;
 }).filter(Boolean);
 const specs={accounts:['balance'],budgets:['limit','amount'],goals:['target','saved'],bills:['amount'],assets:['currentValue','costBasis'],liabilities:['outstanding'],loans:['currentOutstanding','emi','rate'],taxes:['amountDue','amountPaid'],recurringRules:['amount']};
 for(const [key,fields] of Object.entries(specs)){

function recurringMonthlyAmount(amount,frequency){const n=Math.max(0,Number(amount)||0);switch(String(frequency||'Monthly').toLowerCase()){case'weekly':return n*52/12;case'quarterly':return n/3;case'yearly':case'annually':return n/12;default:return n;}}
function advanceDate(date,frequency,anchorDay=null){const d=new Date((validISODate(date)?date:dateISO(now))+'T12:00:00'),freq=String(frequency||'Monthly').toLowerCase();if(freq==='weekly'){d.setDate(d.getDate()+7);return dateISO(d);}const months=freq==='quarterly'?3:freq==='yearly'||freq==='annually'?12:1;const parsedAnchor=Number(anchorDay),targetDay=Number.isInteger(parsedAnchor)&&parsedAnchor>=1&&parsedAnchor<=31?parsedAnchor:d.getDate();d.setDate(1);d.setMonth(d.getMonth()+months);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(targetDay,last));return dateISO(d);}
function showRecurringModal(existing=null){const r=existing||{name:'',amount:0,type:'expense',category:'Bills',accountId:data.accounts[0]?.id||'',method:'UPI',frequency:'Monthly',nextDate:dateISO(now),tags:[]};const types=[{value:'expense',label:'Expense'},{value:'income',label:'Income'}],freq=['Weekly','Monthly','Quarterly','Yearly'];openModal(existing?'Edit recurring rule':'Add recurring rule','Rules never post transactions silently. Use “Record next” when you want to create the next scheduled entry.',`${field('Rule name','name',r.name,'text','required maxlength="120"')}${field('Amount (₹)','amount',r.amount,'number','required min="0.01" step="0.01"')}${field('Type','type',r.type||'expense','text','',types)}${field('Category','category',r.category||'Bills','text','',categoryOpts(false))}${field('Account','accountId',r.accountId||'','text','',accountOpts())}${field('Payment method','method',r.method||'UPI','text','maxlength="40"')}${field('Frequency','frequency',r.frequency||'Monthly','text','',freq)}${field('Next occurrence','nextDate',validISODate(r.nextDate)?r.nextDate:dateISO(now),'date','required')}${field('Tags','tags',Array.isArray(r.tags)?r.tags.map(x=>'#'+x).join(' '):'','text','placeholder="#rent #salary"')}`, 'Save rule',fd=>{const x=Object.fromEntries(fd.entries()),amount=roundCents(Number(x.amount));if(!x.name.trim()||!Number.isFinite(Number(x.amount))||amount<=0||!validISODate(x.nextDate)){toast('Enter a name, positive amount, and valid next date.',false);return false;}const anchorDay=existing&&x.nextDate===existing.nextDate&&Number.isInteger(Number(existing.anchorDay))&&Number(existing.anchorDay)>=1&&Number(existing.anchorDay)<=31?Number(existing.anchorDay):Number(x.nextDate.slice(8,10));const rule={...existing,id:existing?.id||uid(),name:x.name.trim(),amount,type:x.type==='income'?'income':'expense',category:x.type==='income'?(x.category||'Salary'):(x.category||'Bills'),accountId:x.accountId||'',method:x.method||'',frequency:x.frequency||'Monthly',nextDate:x.nextDate,anchorDay,tags:parseTags(x.tags)};if(existing)Object.assign(existing,rule);else data.recurringRules.push(rule);save();render();toast(existing?'Recurring rule updated.':'Recurring rule saved.');});}
function showCategoryModal(existingName=null){const isEdit=!!existingName,meta=existingName?data.settings.categoryMeta?.[existingName]||{}:{};const body=`${field('Category name','name',existingName||'','text',`required maxlength="40" ${isEdit&&isSystemCategory(existingName)?'readonly':''}`)}${field('Emoji / icon','icon',meta.icon||categoryMeta[existingName]?.icon||'✦','text','required maxlength="6"')}${field('Colour','color',safeColor(meta.color||categoryMeta[existingName]?.color,'#8994a4'),'color','required')}`;openModal(isEdit?'Customize category':'Add custom category',isEdit&&isSystemCategory(existingName)?'Built-in category names cannot be renamed, but their icon and colour can be customized.':'Use short, distinct names; existing items will be updated if a custom category is renamed.',body,'Save category',fd=>{const x=Object.fromEntries(fd.entries()),name=x.name.trim(),old=existingName;if(!name){toast('Enter a category name.',false);return false;}if(old&&isSystemCategory(old)&&name!==old){toast('Built-in category names cannot be renamed.',false);return false;}if(name!==old&&categories.some(c=>c.toLowerCase()===name.toLowerCase())){toast('A category with that name already exists.',false);return false;}const existingCustom=data.settings.customCategories||[];if(!old){if(categories.some(c=>c.toLowerCase()===name.toLowerCase())){toast('A category with that name already exists.',false);return false;}existingCustom.push(name);}else if(name!==old){const idx=existingCustom.indexOf(old);if(idx>=0)existingCustom[idx]=name;for(const t of [...data.transactions,...data.deletedTransactions.map(trashedTx)]){if(t?.category===old)t.category=name;if(Array.isArray(t?.splits))t.splits.forEach(sp=>{if(sp.category===old)sp.category=name;});}data.budgets.forEach(b=>{if(b.category===old)b.category=name;});if(selectedCategory===old)selectedCategory=name;}

function download(name,content,type='text/plain'){
 const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();

}

  case'pro-add-recurring':showRecurringModal();break;case'pro-edit-recurring':{const r=existingRecord(data.recurringRules,id,'Recurring rule');if(r)showRecurringModal(r);break;}
  case'pro-delete-recurring':if(confirm('Delete this recurring rule? Already-recorded transactions will remain.')){data.recurringRules=data.recurringRules.filter(x=>x.id!==id);save();render();toast('Recurring rule deleted.');}break;
  case'pro-skip-recurring':{const r=data.recurringRules.find(x=>x.id===id);if(!r)break;if(!confirm(`Skip the occurrence on ${fmtDate(r.nextDate)} for “${r.name}”?`))break;const baseDate=validISODate(r.nextDate)?r.nextDate:dateISO(now),anchorDay=Number.isInteger(Number(r.anchorDay))&&Number(r.anchorDay)>=1&&Number(r.anchorDay)<=31?Number(r.anchorDay):Number(baseDate.slice(8,10));r.anchorDay=anchorDay;r.nextDate=advanceDate(baseDate,r.frequency,anchorDay);save();render();toast('Next recurring occurrence skipped.');break;}
  case'pro-record-recurring':{const r=data.recurringRules.find(x=>x.id===id);if(!r)break;if(!confirm(`Record “${r.name}” for ${fmtDate(r.nextDate)} (${money(r.amount)})?`))break;const date=validISODate(r.nextDate)?r.nextDate:dateISO(now);const recurringTx={id:uid(),description:r.name,amount:roundCents(r.amount),date,type:r.type==='income'?'income':'expense',category:r.type==='income'?(r.category||'Salary'):(r.category||'Bills'),accountId:r.accountId||'',method:r.method||'',taxTreatment:r.type==='income'?'taxable':undefined,reported:r.type==='income'?true:undefined,tags:parseTags((r.tags||[]).join(' ')),note:'Created from recurring rule: '+r.name};applyTransactionBalanceEffects(recurringTx);data.transactions.push(recurringTx);const anchorDay=Number.isInteger(Number(r.anchorDay))&&Number(r.anchorDay)>=1&&Number(r.anchorDay)<=31?Number(r.anchorDay):Number(date.slice(8,10));r.anchorDay=anchorDay;r.nextDate=advanceDate(date,r.frequency,anchorDay);save();render();toast('Next recurring transaction recorded; next date advanced.');break;}
  case'pro-calendar-prev':{const [y,m]=proCalendarMonth.split('-').map(Number),prev=new Date(y,m-2,1);proCalendarMonth=`${prev.getFullYear()}-${String(prev.getMonth()+1).padStart(2,'0')}`;render();break;}
  case'pro-calendar-next':{const [y,m]=proCalendarMonth.split('-').map(Number),next=new Date(y,m,1);proCalendarMonth=`${next.getFullYear()}-${String(next.getMonth()+1).padStart(2,'0')}`;render();break;}
  case'pro-calendar-today':proCalendarMonth=currentMonth();render();break;
  case'pro-export-report':{const ym=proReportMonth||currentMonth(),txs=data.transactions.filter(t=>t.date?.slice(0,7)===ym),cats={};txs.filter(t=>t.type==='expense').forEach(t=>txSplitParts(t).forEach(x=>cats[x.category]=(cats[x.category]||0)+x.amount));const rows=[['Record type','Date / month','Description / category','Transaction type','Income (INR)','Expense (INR)','Net (INR)'],['Summary',ym,'Selected month cash flow','',incByMonth(ym),expByMonth(ym),roundCents(incByMonth(ym)-expByMonth(ym))],...Object.entries(cats).map(([c,v])=>['Category',ym,c,'','',v,'']),...txs.map(t=>['Transaction',t.date,t.description,t.type,t.type==='income'?t.amount:'',t.type==='expense'?t.amount:'',t.type==='income'?t.amount:t.type==='expense'?-t.amount:0])];download(`money-map-report-${ym}.csv`,csvText(rows),'text/csv;charset=utf-8;');break;}
  case'pro-bulk-delete':if(!proSelectedTx.size){toast('Select at least one transaction.',false);break;}const selected=data.transactions.filter(t=>proSelectedTx.has(t.id));if(!selected.length){proSelectedTx.clear();toast('The selected transactions no longer exist.',false);render();break;}if(!confirm(`Move ${selected.length} selected transaction(s) to Recently deleted? You can restore them from Settings.`))break;archiveTransactions(selected);selected.forEach(reverseTransactionBalanceEffects);const selectedIds=new Set(selected.map(t=>t.id));data.transactions=data.transactions.filter(t=>!selectedIds.has(t.id));proSelectedTx.clear();save();render();toast('Selected transactions moved to Recently deleted.');break;
  case'pro-bulk-duplicate':{const items=data.transactions.filter(t=>proSelectedTx.has(t.id));if(!items.length){toast('Select at least one transaction.',false);break;}if(!confirm(`Duplicate ${items.length} selected transaction(s)? Duplicates keep the same date and amount.`))break;const clones=items.map(t=>{const clone={...JSON.parse(JSON.stringify(t)),id:uid(),description:`${t.description} (copy)`,tags:[...txTags(t)],splits:Array.isArray(t.splits)?t.splits.map(x=>({...x})):undefined,note:t.note||''};delete clone.balanceEffects;delete clone.balanceFrozenAccounts;applyTransactionBalanceEffects(clone);return clone;});data.transactions.push(...clones);proSelectedTx.clear();save();render();toast(`${clones.length} transaction(s) duplicated.`);break;}
  case'pro-clear-selection':proSelectedTx.clear();render();break;
  case'restore-deleted-tx':{const entry=data.deletedTransactions.find(e=>e.id===id);if(!entry){toast('That deleted transaction is no longer available.',false);render();break;}const original=trashedTx(entry);if(!original||!['expense','income','transfer'].includes(original.type)||!Number.isFinite(Number(original.amount))||Number(original.amount)<=0||!validISODate(original.date)){toast('This deleted record is invalid and cannot be restored safely.',false);break;}const tx=JSON.parse(JSON.stringify(original));if(tx.type==='transfer'){if(!data.accounts.some(a=>a.id===tx.accountId)||!data.accounts.some(a=>a.id===tx.toAccountId)||tx.accountId===tx.toAccountId){toast('Restore or recreate both transfer accounts first, then try again.',false);break;}}else if(tx.accountId&&!data.accounts.some(a=>a.id===tx.accountId))tx.accountId='';tx.balanceFrozenAccounts=Array.isArray(tx.balanceFrozenAccounts)?tx.balanceFrozenAccounts.filter(aid=>data.accounts.some(a=>a.id===aid)):[];if(data.transactions.some(t=>t.id===tx.id))tx.id=uid();delete tx.balanceEffects;if(!categories.includes(tx.category)||tx.category==='Transfer'&&tx.type!=='transfer')tx.category=tx.type==='transfer'?'Transfer':'Other';if(Array.isArray(tx.splits)){const sum=roundCents(tx.splits.reduce((n,x)=>n+Number(x.amount||0),0));if(tx.type!=='expense'||sum!==roundCents(Number(tx.amount))||tx.splits.some(x=>!categories.includes(x.category)||x.category==='Transfer'))delete tx.splits;}applyTransactionBalanceEffects(tx);data.transactions.push(tx);data.deletedTransactions=data.deletedTransactions.filter(e=>e.id!==id);save();render();toast('Transaction restored.');break;}
  case'permanently-delete-tx':{const entry=data.deletedTransactions.find(e=>e.id===id);if(!entry)break;if(!confirm('Permanently delete this trashed transaction? This cannot be undone.'))break;data.deletedTransactions=data.deletedTransactions.filter(e=>e.id!==id);save();render();toast('Deleted transaction removed permanently.');break;}
  case'empty-trash':if(!data.deletedTransactions.length)break;if(!confirm(`Permanently delete all ${data.deletedTransactions.length} trashed transaction(s)? This cannot be undone.`))break;data.deletedTransactions=[];save();render();toast('Trash emptied.');break;
  case'open-help':showHelp();break;
 }
});

document.addEventListener('change',e=>{
 if(e.target.id==='proSelectAll'){
  const visibleIds=$$('.pro-tx-check').map(el=>el.dataset.id);
  if(e.target.checked)visibleIds.forEach(id=>proSelectedTx.add(id));else visibleIds.forEach(id=>proSelectedTx.delete(id));
  render();
 }else if(e.target.classList.contains('pro-tx-check')){
  if(e.target.checked)proSelectedTx.add(e.target.dataset.id);else proSelectedTx.delete(e.target.dataset.id);
  render();
 }
});

document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){closeModal();return;}
 const mod=e.ctrlKey||e.metaKey,modalOpen=$('#modalBackdrop').classList.contains('open');
 if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();backupJSON();return;}
 if(mod&&e.key.toLowerCase()==='k'){e.preventDefault();if(modalOpen)toast('Close the current dialog before opening Quick Add.',false);else showQuickAdd();return;}
 const typing=e.target.matches('input,textarea,select');
 if(modalOpen||typing||mod||e.altKey||e.target.isContentEditable)return;
 if(e.key.toLowerCase()==='n'){e.preventDefault();showTxModal();}
 else if(e.key==='/'){e.preventDefault();if(page!=='transactions')setPage('transactions');setTimeout(()=>$('#txSearch')?.focus(),0);}
});

$('#importFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{if(f.size>25*1024*1024)throw Error('Backup is larger than 25 MB; import a smaller JSON backup.');const parsed=JSON.parse(await f.text());if(!parsed||!Array.isArray(parsed.transactions))throw Error('Invalid Money Map JSON backup: a transactions array is required.');const candidate=normalizeDataset(parsed,true);if(!confirm('Restore this backup and replace the current Money Map workspace? Export a backup first if you need to keep the current data.'))return;data=candidate;refreshCategories();proSelectedTx.clear();txSearch='';txType='all';selectedCategory='all';txAccount='all';txTag='all';txSort='newest';proCalendarMonth=data.settings.month||currentMonth();proReportMonth=data.settings.month||currentMonth();save();render();toast('Backup restored successfully.');}catch(err){toast(err.message||'Could not restore backup. Your current data has not been replaced.',false);}finally{e.target.value='';}};

$('#privacyToggle').onclick=()=>{data.settings.hideBalances=!data.settings.hideBalances;save();render();};
$('#themeToggle').onclick=()=>{data.settings.theme=data.settings.theme==='dark'?'light':'dark';save();render();};
$('#helpToggle').onclick=showHelp;
$('#topDate').onclick=()=>{if(page!=='dashboard')setPage('dashboard');const picker=$('#monthSelect');if(picker){picker.focus();picker.click();}};
$('#topAdd').onclick=()=>showTxModal();
$('#mobileMenu').onclick=()=>$('#sidebar').classList.toggle('mobile-open');
$('#modalBackdrop').addEventListener('click',e=>{if(e.target===$('#modalBackdrop'))closeModal();});

setPage('dashboard');
render();
})();
</script>
</body>
</html>
